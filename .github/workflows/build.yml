name: Build Release

# 触发：推送 v* 标签（如 v0.0.1）或手动运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux tkinter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ModelBalance.spec --noconfirm

      - name: Rename artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/ModelBalance.exe dist/API-Balance-Monitor-windows-amd64.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv dist/ModelBalance dist/API-Balance-Monitor-macos
          else
            mv dist/ModelBalance dist/API-Balance-Monitor-linux-amd64
          fi
        env:
          RUNNER_OS: ${{ runner.os }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## v0.0.2

            ### 更新说明
            - 修复：每日用量缓存被 DeepSeek 同步覆盖丢失，Kimi 等平台历史记录不再丢失
            - 修复：Kimi 每日用量打开时缓存优先，不再每次都等慢的浏览器同步
            - 优化：初始界面闪烁（卡片更新去抖合并、列表重建减少闪烁帧）
            - 新增：程序崩溃弹窗显示错误信息并写日志，不再闪退
            - 新增：统一测试入口 run_tests.py；开源文档体系（贡献指南/架构/FAQ/变更日志/Issue-PR 模板/截图/徽章）

            ### 安装包
            - Windows: `API-Balance-Monitor-windows-amd64.exe`
            - macOS: `API-Balance-Monitor-macos`
            - Linux: `API-Balance-Monitor-linux-amd64`

            > 安装包不包含在源码仓库中，仅发布在 GitHub Releases。
            > 完整变更见 CHANGELOG.md
